<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="creative-medium" content="interactive-prototype">
  <title>资源预约 · 健康管理中心</title>
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #E8E6E1;
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #1C2B2B;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .page-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .page-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      letter-spacing: 0.3em;
      color: #5A6B6B;
      font-weight: 500;
      text-transform: uppercase;
    }

    /* ===== App styles ===== */
    .app-shell {
      width: 100%;
      height: 100%;
      background: #F5F3EF;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      padding: 0 20px 12px;
      background: #F5F3EF;
      position: relative;
      z-index: 5;
    }
    .top-bar h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 700;
      color: #1C2B2B;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .top-bar .subtitle {
      font-size: 13px;
      color: #7A8B8B;
      font-weight: 400;
    }

    /* Hero banner */
    .hero-banner-wrap {
      margin: 0 0 18px;
      padding-top: var(--ios-safe-top);
    }
    .hero-banner {
      position: relative;
      overflow: hidden;
      aspect-ratio: 16 / 8.5;
    }
    .hero-banner::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 20px;
      background: linear-gradient(to bottom, transparent, #F5F3EF);
      pointer-events: none;
      z-index: 2;
    }
    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero-banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(20, 30, 60, 0.55) 0%, rgba(20, 30, 60, 0.2) 50%, rgba(232, 116, 59, 0.25) 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 22px;
    }
    .hero-eyebrow {
      font-size: 11px;
      color: rgba(255, 220, 160, 0.9);
      letter-spacing: 0.3em;
      font-weight: 500;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .hero-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.06em;
      line-height: 1.35;
      margin-bottom: 6px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .hero-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.88);
      line-height: 1.6;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    .hero-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 12px;
      background: rgba(232, 116, 59, 0.9);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 0.05em;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(232, 116, 59, 0.4);
    }

    /* Date selector */
    .date-section {
      padding: 0 0 16px;
      background: transparent;
    }
    .date-label {
      font-size: 13px;
      color: #5A6B6B;
      margin-bottom: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .date-row {
      display: flex;
      gap: 10px;
    }
    .date-item {
      flex: 1;
      background: #fff;
      border: 1.5px solid transparent;
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 1px 3px rgba(28, 43, 43, 0.04);
    }
    .date-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(28, 43, 43, 0.08);
    }
    .date-item.active {
      border-color: #2E7D75;
      background: #2E7D75;
    }
    .date-item.active .date-day,
    .date-item.active .date-weekday,
    .date-item.active .date-month {
      color: #fff;
    }
    .date-day {
      font-family: 'Noto Serif SC', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1C2B2B;
      line-height: 1.1;
      margin-bottom: 2px;
    }
    .date-weekday {
      font-size: 11px;
      color: #7A8B8B;
      margin-bottom: 1px;
      font-weight: 500;
    }
    .date-month {
      font-size: 10px;
      color: #9AAAAA;
      letter-spacing: 0.05em;
    }

    /* Scroll area */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 20px 20px;
      -webkit-overflow-scrolling: touch;
    }
    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    .section-heading {
      font-family: 'Noto Serif SC', serif;
      font-size: 17px;
      font-weight: 700;
      color: #1C2B2B;
      letter-spacing: 0.04em;
      margin: 4px 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-heading::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: linear-gradient(to bottom, #2E7D75, #3D9990);
      border-radius: 2px;
    }

    /* Resource card */
    .resource-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px rgba(28, 43, 43, 0.06);
      transition: box-shadow 0.3s ease;
      position: relative;
    }
    .resource-card.has-selected {
      box-shadow: 0 4px 16px rgba(46, 125, 117, 0.18);
    }
    .resource-card-header {
      position: relative;
      cursor: pointer;
      aspect-ratio: 4 / 2.2;
      overflow: hidden;
    }
    .resource-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .resource-card-header:hover .resource-card-img {
      transform: scale(1.04);
    }
    .resource-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.15) 50%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px 18px;
    }
    .resource-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.03em;
      margin-bottom: 2px;
    }
    .resource-meta {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .resource-meta-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.6);
    }
    .expand-icon {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }
    .expand-icon.expanded {
      transform: rotate(180deg);
      background: #fff;
    }
    .expand-icon svg {
      width: 16px;
      height: 16px;
      color: #2E7D75;
    }
    .selected-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: #E8743B;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.03em;
      box-shadow: 0 2px 6px rgba(232, 116, 59, 0.4);
    }

    /* Expand panel */
    .expand-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      background: #fff;
    }
    .expand-panel.open {
      max-height: 500px;
    }
    .expand-content {
      padding: 0 18px 18px;
      border-top: 1px solid #F0EDE6;
      padding-top: 14px;
    }
    .resource-desc {
      font-size: 13px;
      line-height: 1.7;
      color: #5A6B6B;
      margin-bottom: 14px;
    }
    .time-slots-label {
      font-size: 12px;
      font-weight: 700;
      color: #2E7D75;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .time-slots-label::before {
      content: '';
      display: inline-block;
      width: 3px;
      height: 12px;
      background: #2E7D75;
      border-radius: 2px;
    }
    .time-slot-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .time-slot {
      background: #F5F3EF;
      border: 1.5px solid transparent;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #1C2B2B;
      transition: all 0.2s ease;
      user-select: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .time-slot:focus,
    .time-slot:focus-visible,
    .time-slot:active {
      outline: none;
      box-shadow: none;
    }
    .time-slot:hover:not(.full):not(.selected) {
      border-color: #2E7D75;
      background: #E8F0EF;
    }
    .time-slot.selected {
      background: #2E7D75;
      border-color: #2E7D75;
      color: #fff;
    }
    .time-slot.full {
      background: #F0EDE6;
      color: #B8B0A8;
      cursor: not-allowed;
      text-decoration: line-through;
      text-decoration-color: #B8B0A8;
    }

    /* Form panel (in-flow, at end of scroll list) */
    .form-panel {
      background: #fff;
      border-radius: 16px;
      padding: 18px 18px 20px;
      margin-top: 4px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(28, 43, 43, 0.06);
    }

    /* Dynamic form fields */
    .form-section {
      margin-bottom: 14px;
    }
    .form-section.hidden {
      display: none;
    }
    .form-tip {
      background: #FFF4EA;
      border: 1px solid #F9D8BA;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #8B4A20;
      line-height: 1.6;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .form-tip-icon {
      flex-shrink: 0;
      margin-top: 1px;
      color: #E8743B;
    }
    .form-tip strong {
      color: #C45A1F;
      font-weight: 700;
    }

    .form-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .form-row:last-child {
      margin-bottom: 0;
    }
    .form-field {
      flex: 1;
    }
    .form-field.full {
      flex: none;
      width: 100%;
    }
    .form-field label {
      display: block;
      font-size: 12px;
      color: #5A6B6B;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-field label .required {
      color: #E8743B;
      margin-left: 2px;
    }
    .form-input {
      width: 100%;
      height: 42px;
      border: 1.5px solid #E8E6E1;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: #1C2B2B;
      background: #FAF8F4;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .form-input:focus {
      border-color: #2E7D75;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(46, 125, 117, 0.12);
    }
    .form-input::placeholder {
      color: #B8B0A8;
    }
    .input-with-unit {
      position: relative;
    }
    .input-unit {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: #9AAAAA;
      pointer-events: none;
    }
    .input-with-unit .form-input {
      padding-right: 40px;
    }

    /* Gender selector */
    .gender-group {
      display: flex;
      gap: 8px;
    }
    .gender-btn {
      flex: 1;
      height: 42px;
      border: 1.5px solid #E8E6E1;
      border-radius: 10px;
      background: #FAF8F4;
      font-size: 14px;
      color: #5A6B6B;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      font-weight: 500;
    }
    .gender-btn:hover {
      border-color: #2E7D75;
    }
    .gender-btn.active {
      background: #2E7D75;
      border-color: #2E7D75;
      color: #fff;
    }

    /* Submit button */
    .submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #2E7D75 0%, #3D9990 100%);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(46, 125, 117, 0.3);
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(46, 125, 117, 0.4);
    }
    .submit-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    .submit-btn:disabled {
      background: #C8D4D2;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Selected summary */
    .selected-summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .selected-summary-text {
      font-size: 13px;
      color: #5A6B6B;
    }
    .selected-summary-text strong {
      color: #2E7D75;
      font-weight: 700;
    }
    .clear-btn {
      font-size: 12px;
      color: #9AAAAA;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .clear-btn:hover {
      color: #E8743B;
      background: #FFF4EA;
    }

    /* Empty state hint */
    .empty-hint {
      text-align: center;
      padding: 30px 20px;
      color: #9AAAAA;
      font-size: 13px;
      line-height: 1.8;
    }
    .empty-hint-icon {
      font-size: 32px;
      margin-bottom: 10px;
      opacity: 0.5;
    }

    /* Success overlay */
    .success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(245, 243, 239, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      backdrop-filter: blur(8px);
    }
    .success-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2E7D75, #3D9990);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(46, 125, 117, 0.35);
    }
    .success-icon svg {
      width: 36px;
      height: 36px;
      color: #fff;
    }
    .success-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 22px;
      font-weight: 700;
      color: #1C2B2B;
      margin-bottom: 8px;
    }
    .success-sub {
      font-size: 13px;
      color: #7A8B8B;
      margin-bottom: 28px;
      text-align: center;
      line-height: 1.6;
      padding: 0 30px;
    }
    .success-back-btn {
      background: #fff;
      border: 1.5px solid #2E7D75;
      color: #2E7D75;
      padding: 12px 32px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }
    .success-back-btn:hover {
      background: #2E7D75;
      color: #fff;
    }

    /* Section divider */
    .section-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 14px;
    }
    .section-divider-line {
      flex: 1;
      height: 1px;
      background: #E8E6E1;
    }
    .section-divider-text {
      font-size: 11px;
      color: #9AAAAA;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      html, body {
        overflow-x: hidden;
      }
      body { padding: 0; background: #E8E6E1; }
      .page-title { display: none; }
      .page-root { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page-root">
    <div class="page-title">资源预约原型 · H5</div>
    <div id="root"></div>
  </div>

  <script type="text/babel">

          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      border: '1px solid #DEE0E3',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
      '--ios-safe-top': '62px',
      '--ios-safe-bottom': '34px',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* content — isolate:isolate keeps the screen in its own stacking
          context so any z-index authored inside it stays *below* the frame
          chrome (status bar z:10, island z:50, home indicator z:60); a
          sticky/opaque header with a high z-index can no longer paint over
          the status bar. */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column', isolation: 'isolate' }}>
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSList, IOSListRow, IOSKeyboard,
});

    // ====== Icons ======
    const ChevronDown = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    );

    const CheckIcon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    );

    const InfoIcon = () => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink: 0, marginTop: 1}}>
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    );

    // ====== Components ======
    function DateSelector({ selected, onSelect }) {
      return (
        <div className="date-section">
          <div className="date-label">选择到访日期</div>
          <div className="date-row">
            {DATES.map((d, i) => (
              <div
                key={i}
                className={`date-item ${selected === i ? 'active' : ''}`}
                onClick={() => onSelect(i)}
              >
                <div className="date-day">{d.day}</div>
                <div className="date-weekday">{d.weekday}</div>
                <div className="date-month">{d.month}</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ResourceCard({ resource, index, expanded, onToggle, selectedSlot, onSelectSlot }) {
      const hasSelected = selectedSlot !== null;
      return (
        <div className={`resource-card ${hasSelected ? 'has-selected' : ''}`} data-comment-anchor={`resource-card-${index}`}>
          <div className="resource-card-header" onClick={onToggle}>
            <img className="resource-card-img" src={resource.img} alt={resource.name} />
            <div className="resource-card-overlay">
              <div className="resource-name">{resource.name}</div>
              <div className="resource-meta">
                <span>{resource.meta[0]}</span>
                <span className="resource-meta-dot"></span>
                <span>{resource.meta[1]}</span>
              </div>
            </div>
            <div className={`expand-icon ${expanded ? 'expanded' : ''}`}>
              <ChevronDown />
            </div>
            {hasSelected && (
              <div className="selected-badge">已选 {selectedSlot}</div>
            )}
          </div>
          <div className={`expand-panel ${expanded ? 'open' : ''}`}>
            <div className="expand-content">
              <p className="resource-desc">{resource.desc}</p>
              <div className="time-slots-label">可选时段</div>
              <div className="time-slot-grid">
                {resource.slots.map((slot, si) => (
                  <div
                    key={si}
                    className={`time-slot ${slot.full ? 'full' : ''} ${selectedSlot === slot.time ? 'selected' : ''}`}
                    onClick={() => {
                      if (slot.full) return;
                      onSelectSlot(selectedSlot === slot.time ? null : slot.time);
                    }}
                  >
                    {slot.time}
                    {slot.full && <span style={{ display: 'block', fontSize: '10px', marginTop: 2 }}>已满</span>}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function BottomPanel({
      needsBodyInfo,
      formData,
      onFormChange,
      onGenderChange,
      onSubmit,
      onClear,
      selectedCount,
    }) {
      const canSubmit = useMemo(() => {
        if (!formData.name || !formData.phone) return false;
        if (needsBodyInfo) {
          if (!formData.gender) return false;
          if (!formData.height || !formData.weight) return false;
        }
        return true;
      }, [needsBodyInfo, formData]);

      return (
        <div className="form-panel">
              <div className="selected-summary">
                <div className="selected-summary-text">
                  已选 <strong>{selectedCount}</strong> 个预约项目
                </div>
                <button className="clear-btn" onClick={onClear}>清空选择</button>
              </div>

              {needsBodyInfo && (
                <div className="form-section">
                  <div className="form-tip">
                    <span className="form-tip-icon"><InfoIcon /></span>
                    <span>您预约的项目需要我们给您准备服装，所以请您告知您的身高、体重和性别。</span>
                  </div>
                  <div className="form-row">
                    <div className="form-field">
                      <label>身高<span className="required">*</span></label>
                      <div className="input-with-unit">
                        <input
                          className="form-input"
                          type="number"
                          placeholder="请输入身高"
                          value={formData.height}
                          onChange={(e) => onFormChange('height', e.target.value)}
                        />
                        <span className="input-unit">cm</span>
                      </div>
                    </div>
                    <div className="form-field">
                      <label>体重<span className="required">*</span></label>
                      <div className="input-with-unit">
                        <input
                          className="form-input"
                          type="number"
                          placeholder="请输入体重"
                          value={formData.weight}
                          onChange={(e) => onFormChange('weight', e.target.value)}
                        />
                        <span className="input-unit">kg</span>
                      </div>
                    </div>
                  </div>
                  <div className="form-row">
                    <div className="form-field full">
                      <label>性别<span className="required">*</span></label>
                      <div className="gender-group">
                        <button
                          className={`gender-btn ${formData.gender === 'male' ? 'active' : ''}`}
                          onClick={() => onGenderChange('male')}
                          type="button"
                        >
                          男
                        </button>
                        <button
                          className={`gender-btn ${formData.gender === 'female' ? 'active' : ''}`}
                          onClick={() => onGenderChange('female')}
                          type="button"
                        >
                          女
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <div className="form-section">
                <div className="section-divider">
                  <div className="section-divider-line"></div>
                  <div className="section-divider-text">预约信息</div>
                  <div className="section-divider-line"></div>
                </div>
                <div className="form-row">
                  <div className="form-field">
                    <label>姓名<span className="required">*</span></label>
                    <input
                      className="form-input"
                      type="text"
                      placeholder="请输入真实姓名"
                      value={formData.name}
                      onChange={(e) => onFormChange('name', e.target.value)}
                    />
                  </div>
                </div>
                <div className="form-row">
                  <div className="form-field full">
                    <label>手机号<span className="required">*</span></label>
                    <input
                      className="form-input"
                      type="tel"
                      placeholder="请输入手机号码"
                      value={formData.phone}
                      onChange={(e) => onFormChange('phone', e.target.value)}
                      maxLength={11}
                    />
                  </div>
                </div>
              </div>

              <button
                className="submit-btn"
                onClick={onSubmit}
                disabled={!canSubmit}
              >
                提交预约
              </button>
        </div>
      );
    }

    function SuccessOverlay({ show, onBack }) {
      return (
        <div className={`success-overlay ${show ? 'show' : ''}`}>
          <div className="success-icon">
            <CheckIcon />
          </div>
          <div className="success-title">预约成功</div>
          <div className="success-sub">
            您的预约已提交<br />
            稍后将有工作人员与您联系确认
          </div>
          <button className="success-back-btn" onClick={onBack}>
            返回继续预约
          </button>
        </div>
      );
    }

    function App() {
      const [selectedDate, setSelectedDate] = useState(0);
      const [expandedIndex, setExpandedIndex] = useState(null);
      // Map: resourceId -> selected time slot
      const [selectedSlots, setSelectedSlots] = useState({});
      const [formData, setFormData] = useState({
        name: '',
        phone: '',
        height: '',
        weight: '',
        gender: '',
      });
      const [showSuccess, setShowSuccess] = useState(false);

      const hasSelection = Object.keys(selectedSlots).length > 0;
      const selectedCount = Object.keys(selectedSlots).length;

      // 第 1 个或第 3 个资源被预约时，需要补充性别、身高和体重信息
      const needsBodyInfo = useMemo(() => {
        const firstSelected = !!selectedSlots[RESOURCES[0].id];
        const thirdSelected = !!selectedSlots[RESOURCES[2].id];
        return firstSelected || thirdSelected;
      }, [selectedSlots]);

      const handleToggleCard = (index) => {
        setExpandedIndex(expandedIndex === index ? null : index);
      };

      const handleSelectSlot = (resourceId, time) => {
        setSelectedSlots(prev => {
          const next = { ...prev };
          if (time === null) {
            delete next[resourceId];
          } else {
            next[resourceId] = time;
          }
          return next;
        });
      };

      const handleFormChange = (key, value) => {
        setFormData(prev => ({ ...prev, [key]: value }));
      };

      const handleGenderChange = (gender) => {
        setFormData(prev => ({ ...prev, gender }));
      };

      const handleClear = () => {
        setSelectedSlots({});
      };

      const handleSubmit = () => {
        setShowSuccess(true);
      };

      const handleBack = () => {
        setShowSuccess(false);
        setSelectedSlots({});
        setFormData({
          name: '',
          phone: '',
          height: '',
          weight: '',
          gender: '',
        });
        setExpandedIndex(null);
      };

        <div className="app-shell">
